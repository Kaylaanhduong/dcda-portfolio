<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Location Coordinates</title>
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            height: 100vh;
        }
        
        #map {
            flex: 1;
            position: relative;
        }
        
        #sidebar {
            width: 400px;
            background: #f5f5f5;
            overflow-y: auto;
            padding: 20px;
            border-left: 1px solid #ddd;
        }
        
        h1 {
            margin-bottom: 20px;
            font-size: 20px;
            color: #333;
        }
        
        .location-item {
            background: white;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff6b6b;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .location-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transform: translateX(5px);
        }
        
        .location-item.active {
            background: #e3f2fd;
            border-left-color: #2196F3;
        }
        
        .location-name {
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }
        
        .location-coords {
            font-size: 12px;
            color: #666;
            font-family: monospace;
        }
        
        .coord-input {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
            font-size: 11px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        
        .status {
            margin-top: 5px;
            font-size: 12px;
            color: #ff6b6b;
        }
        
        .info-box {
            position: absolute;
            top: 20px;
            left: 20px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 10;
            max-width: 300px;
            font-size: 13px;
            color: #666;
        }
        
        .instructions {
            background: #fff3cd;
            border: 1px solid #ffc107;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 12px;
            color: #856404;
        }
        
        button {
            background: #2196F3;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
            width: 100%;
        }
        
        button:hover {
            background: #1976D2;
        }
        
        .copy-btn {
            background: #4CAF50;
            padding: 5px 10px;
            font-size: 11px;
            margin-top: 5px;
        }
        
        .copy-btn:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="sidebar">
        <h1>📍 Verify Coordinates</h1>
        <div class="instructions">
            💡 <strong>Click on a location</strong> to see it on the map. <strong>Right-click the marker</strong> to get exact coordinates. Paste corrected coordinates in the input box below.
        </div>
        <div id="locationsList"></div>
    </div>
    
    <div class="info-box">
        <strong>Coordinates Format:</strong><br>
        Latitude, Longitude<br>
        (e.g., 10.7722, 106.6947)
    </div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoia2F5bGFhbmhkdW9uZyIsImEiOiJjbWx0cXJoZnIwMzduM2duNXRxbWgzYXRqIn0.pDLb-dh5YY3pO4C4LUqW6g';
        
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/kaylaanhduong/cmm8dfrh0000w01qr9d2e9ac8',
            center: [106.6947, 10.7722],
            zoom: 11
        });

        // Original locations from your geocoding results
        const locations = [
            { name: 'Tran Dai Nghia High School for the Gifted', lat: 10.777952, lon: 106.701035, type: 'Schools & Educational Institutions' },
            { name: 'High School for the Gifted VNUHCM', lat: 10.387766, lon: 107.239420, type: 'Schools & Educational Institutions' },
            { name: 'Landmark 81', lat: 10.801288, lon: 106.711907, type: 'Landmark' },
            { name: 'Cơm Tấm Mộc', lat: 10.772146, lon: 106.694448, type: 'Restaurants & Cafes' },
            { name: 'Ben Thanh Market', lat: 10.773619, lon: 106.694479, type: 'Culture & History' },
            { name: 'Nam Giao Restaurant', lat: 10.773803, lon: 106.698648, type: 'Restaurants & Cafes' },
            { name: 'Tôn Thất Đạm Apartment Building', lat: 10.771317, lon: 106.703253, type: 'Culture & History' },
            { name: 'War Remnants Museum', lat: 10.780360, lon: 106.691890, type: 'Culture & History' },
            { name: 'Morico Saigon Pearl', lat: 10.789334, lon: 106.715648, type: 'Restaurants & Cafes' },
            { name: 'Hai An Bookstore', lat: 10.485877, lon: 107.222034, type: 'Culture & History' },
            { name: 'Tao Dan Badminton Court', lat: 10.776111, lon: 106.694538, type: 'Recreation' },
            { name: 'CHAY GARDEN Xuân Thủy', lat: 10.803318, lon: 106.732314, type: 'Restaurants & Cafes' }
        ];

        let markers = {};

        // Add markers to map
        locations.forEach((loc, idx) => {
            const el = document.createElement('div');
            el.className = 'marker';
            el.style.width = '32px';
            el.style.height = '32px';
            el.style.backgroundImage = `url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ff6b6b"><path d="M12 0C7.03 0 3 4.03 3 9c0 5.25 9 15 9 15s9-9.75 9-15c0-4.97-4.03-9-9-9zm0 12.5c-1.93 0-3.5-1.57-3.5-3.5S10.07 5.5 12 5.5s3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>')`;
            el.style.backgroundSize = '100%';
            el.style.cursor = 'pointer';
            
            const marker = new mapboxgl.Marker(el)
                .setLngLat([loc.lon, loc.lat])
                .addTo(map);
            
            markers[idx] = { marker, loc };
            
            el.addEventListener('click', () => selectLocation(idx));
            el.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                copyCoordinates(loc.lat, loc.lon);
            });
        });

        // Populate sidebar
        const locationsList = document.getElementById('locationsList');
        locations.forEach((loc, idx) => {
            const div = document.createElement('div');
            div.className = 'location-item';
            div.innerHTML = `
                <div class="location-name">${idx + 1}. ${loc.name}</div>
                <div class="location-coords">📍 ${loc.lat.toFixed(6)}, ${loc.lon.toFixed(6)}</div>
                <div class="status" id="status-${idx}"></div>
                <input type="text" class="coord-input" id="input-${idx}" placeholder="Lat, Lon (e.g., 10.7722, 106.6947)">
                <button onclick="updateCoordinate(${idx})">Update Coordinates</button>
                <button class="copy-btn" onclick="copyCoordinates(${loc.lat}, ${loc.lon})">📋 Copy</button>
            `;
            div.addEventListener('click', () => selectLocation(idx));
            locationsList.appendChild(div);
        });

        function selectLocation(idx) {
            // Update active state
            document.querySelectorAll('.location-item').forEach((el, i) => {
                el.classList.toggle('active', i === idx);
            });
            
            const loc = locations[idx];
            map.flyTo({
                center: [loc.lon, loc.lat],
                zoom: 15,
                duration: 1000
            });
        }

        function updateCoordinate(idx) {
            const input = document.getElementById(`input-${idx}`);
            const value = input.value.trim();
            const status = document.getElementById(`status-${idx}`);
            
            const coords = value.split(',').map(c => parseFloat(c.trim()));
            if (coords.length === 2 && !isNaN(coords[0]) && !isNaN(coords[1])) {
                locations[idx].lat = coords[0];
                locations[idx].lon = coords[1];
                
                // Update marker position
                markers[idx].marker.setLngLat([coords[1], coords[0]]);
                
                status.textContent = '✅ Coordinates updated!';
                status.style.color = '#4CAF50';
                setTimeout(() => {
                    status.textContent = '';
                }, 2000);
                
                // Update display
                document.querySelectorAll('.location-item')[idx].querySelector('.location-coords').textContent = 
                    `📍 ${coords[0].toFixed(6)}, ${coords[1].toFixed(6)}`;
            } else {
                status.textContent = '❌ Invalid format. Use: Lat, Lon';
                status.style.color = '#ff6b6b';
            }
        }

        function copyCoordinates(lat, lon) {
            const text = `${lat.toFixed(6)}, ${lon.toFixed(6)}`;
            navigator.clipboard.writeText(text).then(() => {
                alert(`Copied: ${text}`);
            });
        }

        // Export corrected coordinates
        window.exportCoordinates = function() {
            const csv = locations.map((loc, idx) => {
                const original = locations[idx];
                return `${idx + 1},${original.name},${original.lat.toFixed(6)},${original.lon.toFixed(6)}`;
            }).join('\n');
            
            const blob = new Blob(['Index,Name,Latitude,Longitude\n' + csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'verified_coordinates.csv';
            a.click();
        };

        map.on('load', () => {
            console.log('✅ Map loaded! Click on locations to verify their coordinates.');
            console.log('💡 Right-click any marker to copy its coordinates');
        });
    </script>
</body>
</html>
